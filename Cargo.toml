[workspace]
resolver = "2"
members = ["crates/anonymiser-core", "crates/anonymiser-cli", "crates/anonymiser-wasm"]

[workspace.package]
version = "0.0.7"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/all-hands/spreadsheet-anonymiser-demo"
keywords = ["privacy", "pseudonymisation", "csv", "gdpr"]

[workspace.dependencies]
anonymiser-core = { path = "crates/anonymiser-core" }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
blake2 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
hex = "0.4"
zeroize = "1.5"
unicode-normalization = "0.1"
regex = "1"

[profile.release]
lto = true
strip = true
