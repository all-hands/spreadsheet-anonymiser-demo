[package]
name = "anonymiser-core"
description = "Single implementation of anonymisation semantics shared by the CLI and the browser (wasm)"
license.workspace = true
keywords.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = { workspace = true, default-features = false, features = ["alloc"] }
blake2 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
unicode-normalization = { workspace = true }
regex = { workspace = true }
aes-gcm = "0.11"
base64 = "0.23"
jiff = { version = "0.2.42", default-features = false }
data-encoding = "2.11.1"
thiserror = "2.0.21"
getrandom = "0.4"
ml-kem = { version = "0.3.4", features = ["hazmat", "zeroize"] }
hmac = "0.13"
pbkdf2 = "0.13"
chacha20poly1305 = "0.11"
# INVARIANT: serde_json keeps its default features only: `float_roundtrip` or
# `arbitrary_precision` would change the text of numbers in the output.
csv-core = "0.1.13"
serde_json = "1.0.154"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
csv = "1.4.0"

[[bench]]
name = "cells"
harness = false

[[bench]]
name = "keys"
harness = false

[[bench]]
name = "table"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
