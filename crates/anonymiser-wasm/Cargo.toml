[package]
name = "anonymiser-wasm"
description = "Browser facade (wasm-bindgen) over anonymiser-core"
license.workspace = true
keywords.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anonymiser-core = { workspace = true }
wasm-bindgen = "=0.2.130"
rand_core = "0.10"
serde_json = "1.0.154"
zeroize = { workspace = true }
getrandom = { version = "0.4", features = ["sys_rng", "wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
