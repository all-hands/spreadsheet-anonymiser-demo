[graph]
all-features = false

[advisories]
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "warn"
ignore = [
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "anonymiser-core" },
    { allow = ["AGPL-3.0-or-later"], crate = "anonymiser-cli" },
    { allow = ["AGPL-3.0-or-later"], crate = "anonymiser-wasm" },
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
