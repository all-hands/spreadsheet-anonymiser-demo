server {
    listen       8000;
    server_name  _;

    root   /usr/share/nginx/app;   # not .../html: that directory also holds the stock 50x.html
    index  index.html;

    server_tokens     off;
    absolute_redirect off;   # no scheme/host/port in Location: correct behind any proxy
    autoindex         off;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 405 @method_not_allowed;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    location @method_not_allowed {
        add_header Allow "GET, HEAD" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    location = /assets {
        return 404;
    }
    location /assets/ {
        if (-d $request_filename) {
            return 404;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
